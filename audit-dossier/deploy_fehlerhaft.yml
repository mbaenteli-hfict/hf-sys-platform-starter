# ACHTUNG: Diese Pipeline-Datei enthält 3 bewusste Architektur-/Security-Mängel!
# Auftrag Sprint 3: Findet und behebt alle 3 Mängel.

name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]

# FEHLER-KANDIDAT 1: Reichen diese Berechtigungen für OIDC-Login bei Entra ID?
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          pytest

  deploy:
    # FEHLER-KANDIDAT 2: Was passiert hier, wenn oben 'pytest' fehlschlägt?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build, Push and Deploy
        run: |
          # FEHLER-KANDIDAT 3: Warum ist ':latest' im Produktionsbetrieb problematisch?
          IMG=${{ vars.ACR_NAME }}.azurecr.io/app:latest
          az acr login -n ${{ vars.ACR_NAME }}
          docker build -t $IMG .
          docker push $IMG
          az containerapp up -n ${{ vars.APP_NAME }} \
            -g ${{ vars.RESOURCE_GROUP }} \
            --environment ${{ vars.ACA_ENV }} \
            --image $IMG \
            --target-port 8080 \
            --ingress external
